<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Commerce Crew Platform</title><desc id="desc">A red and copper governed commerce banner showing shopping, seller, support, commerce engine, and multi-channel fulfilment.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#28171c"/><stop offset="1" stop-color="#9c4b43"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".07"/></pattern><style>.t{font:700 42px Segoe UI,Arial;fill:#fff8f2}.s{font:600 15px Segoe UI,Arial;letter-spacing:2.2px;fill:#ffe5d5}.e{font:700 12px Segoe UI,Arial;letter-spacing:2.3px;fill:#ffc17e}.l{font:700 12px Segoe UI,Arial;fill:#fff}.q{font:400 11px Segoe UI,Arial;fill:#f0cec1}</style></defs><rect width="1200" height="360" rx="22" fill="url(#bg)"/><rect width="1200" height="360" rx="22" fill="url(#grid)"/><circle cx="1090" cy="35" r="220" fill="#ffc17e" opacity=".12"/><text x="70" y="66" class="e">COMMERCE CREW � GOVERNED MULTI-CHANNEL COMMERCE</text><text x="70" y="125" class="t">Commerce Crew Platform</text><text x="72" y="160" class="s">DISCOVERY    COMMERCE ENGINE    FULFILMENT    SUPPORT</text><path d="M110 245H1090" stroke="#c87063" stroke-width="2"/><path d="M144 245H1050" stroke="#ffc17e" stroke-width="3"/><g><circle cx="144" cy="245" r="24" fill="#703d42" stroke="#ffc17e" stroke-width="2"/><text x="144" y="250" text-anchor="middle" class="l">01</text><text x="144" y="292" text-anchor="middle" class="l">Shopping</text><text x="144" y="312" text-anchor="middle" class="q">discovery + cart</text><circle cx="383" cy="245" r="24" fill="#703d42" stroke="#ffc17e" stroke-width="2"/><text x="383" y="250" text-anchor="middle" class="l">02</text><text x="383" y="292" text-anchor="middle" class="l">Seller</text><text x="383" y="312" text-anchor="middle" class="q">catalogue + stock</text><circle cx="622" cy="245" r="24" fill="#703d42" stroke="#ffc17e" stroke-width="2"/><text x="622" y="250" text-anchor="middle" class="l">03</text><text x="622" y="292" text-anchor="middle" class="l">Commerce Engine</text><text x="622" y="312" text-anchor="middle" class="q">orders + payments</text><circle cx="861" cy="245" r="24" fill="#703d42" stroke="#ffc17e" stroke-width="2"/><text x="861" y="250" text-anchor="middle" class="l">04</text><text x="861" y="292" text-anchor="middle" class="q">Marketplaces</text><circle cx="1050" cy="245" r="24" fill="#345255" stroke="#a8e8dc" stroke-width="2"/><text x="1050" y="250" text-anchor="middle" class="l">05</text><text x="1050" y="292" text-anchor="middle" class="l">Approvals</text><text x="1050" y="312" text-anchor="middle" class="q">evidence + rollback</text></g><text x="70" y="342" class="q">Conversation-native, marketplace-aware, approval-governed, reliability-first</text></svg>

