<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc"><title id="title">Commerce Crew Platform architecture</title><desc id="desc">Customers, sellers, and operators reach shopping, seller, and support roles that use the Commerce Engine for catalogue, orders, payments, marketplaces, channels, authority, evidence, and reliability.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#28171c"/><stop offset="1" stop-color="#9c4b43"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#ffc17e"/></marker><style>.e{font:700 13px Segoe UI,Arial;letter-spacing:2px;fill:#ffc17e}.t{font:700 32px Segoe UI,Arial;fill:#fff8f2}.s{font:400 15px Segoe UI,Arial;fill:#ffe5d5}.n{fill:#6f3c42;stroke:#c87063;stroke-width:2}.g{fill:#9c4b43;stroke:#ffc17e;stroke-width:2}.y{fill:#345255;stroke:#a8e8dc;stroke-width:2}.l{font:700 16px Segoe UI,Arial;fill:#fff}.b{font:400 13px Segoe UI,Arial;fill:#ffe1d4}.q{font:400 12px Segoe UI,Arial;fill:#efc8bb}.r{stroke:#ffc17e;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1500" height="760" rx="26" fill="url(#bg)"/><text x="64" y="58" class="e">COMMERCE CREW � GOVERNED OPERATING LAYER</text><text x="64" y="106" class="t">Three bounded roles around one Commerce Engine</text><text x="64" y="136" class="s">Source-backed from the README's role model, extensions/, commerce engine modules, and reliability controls.</text><rect x="70" y="220" width="260" height="130" rx="16" class="n"/><text x="200" y="260" text-anchor="middle" class="l">Customers / sellers / operators</text><text x="200" y="290" text-anchor="middle" class="b">stores � marketplaces � voice</text><text x="200" y="318" text-anchor="middle" class="q">conversation + channels</text><path d="M330 285H440" class="r"/><rect x="440" y="170" width="270" height="110" rx="16" class="g"/><text x="575" y="208" text-anchor="middle" class="l">Shopping role</text><text x="575" y="238" text-anchor="middle" class="b">discovery � cart � checkout</text><rect x="440" y="300" width="270" height="110" rx="16" class="g"/><text x="575" y="338" text-anchor="middle" class="l">Seller role</text><text x="575" y="368" text-anchor="middle" class="b">catalogue � inventory � listings</text><rect x="440" y="430" width="270" height="110" rx="16" class="g"/><text x="575" y="468" text-anchor="middle" class="l">Support role</text><text x="575" y="498" text-anchor="middle" class="b">orders � returns � handoff</text><path d="M710 225H820M710 355H820M710 485H820" class="r"/><rect x="820" y="240" width="300" height="260" rx="16" class="y"/><text x="970" y="285" text-anchor="middle" class="l">Commerce Engine</text><text x="970" y="320" text-anchor="middle" class="b">catalogue � orders � payments</text><text x="970" y="348" text-anchor="middle" class="b">returns � marketplaces � channels</text><text x="970" y="376" text-anchor="middle" class="q">queues � retries � circuit breakers</text><text x="970" y="404" text-anchor="middle" class="q">tenant scope + signed sessions</text><path d="M1120 370H1240" class="r"/><rect x="1240" y="240" width="190" height="260" rx="16" class="n"/><text x="1335" y="285" text-anchor="middle" class="l">Consequential action</text><text x="1335" y="325" text-anchor="middle" class="b">approval</text><text x="1335" y="355" text-anchor="middle" class="b">evidence</text><text x="1335" y="385" text-anchor="middle" class="b">rollback</text><text x="1335" y="415" text-anchor="middle" class="q">reliability records</text></svg>

